[project]
name = "lume"
version = "0.1.0"
description = "macOS voice assistant powered by DeepSeek"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.2",
    "funasr>=1.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "pynput>=1.7",
    "pyobjc>=12.0; sys_platform == 'darwin'",
    "scipy>=1.14",
    "sounddevice>=0.4",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.scripts]
lume = "lume.main:main"
lume-prefetch-model = "lume.prefetch:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
