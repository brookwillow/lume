[project]
name = "lume"
version = "0.1.0"
description = "macOS voice assistant powered by DeepSeek"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pynput>=1.7",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "funasr>=1.3",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.scripts]
lume = "lume.main:main"
